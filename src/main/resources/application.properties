spring.application.name=hack-auth
server.port=8080

api.security.token.secret=soat-hackathon-fiap


# Alternativamente:
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=hackaton-auth
spring.data.mongodb.username=
spring.data.mongodb.password=
spring.data.mongodb.uri=mongodb://localhost:27017/hackaton-auth


#RABBITMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest


app.rabbitmq.queue=nome.da.fila
app.rabbitmq.exchange=nome.do.exchange
app.rabbitmq.routingkey=chave.de.rotas

# LOGGING
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.com.seupacote=DEBUG
